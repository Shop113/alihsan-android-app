plugins {
    id 'com.android.application' version '8.5.2' apply false
}
android {
    namespace 'com.alihsan.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alihsan.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { dependency ->
        if (dependency.requested.group == 'org.jetbrains.kotlin') {
            dependency.useVersion '1.8.22'
            dependency.because 'Avoid duplicate Kotlin stdlib jdk7/jdk8 classes in AndroidX dependencies'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
